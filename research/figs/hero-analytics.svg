<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" width="660" height="540"
     role="img" aria-label="Illustration of an analytics workspace: a line chart panel, a bar chart panel, a donut breakdown, a clustered scatter plot and a connected node graph">
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5400A" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#E5400A" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="areaFill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#0C0A09" opacity=".13"/>
    </pattern>
    <clipPath id="panelClip"><rect x="46" y="150" width="392" height="232" rx="3"/></clipPath>
    <clipPath id="panel2Clip"><rect x="398" y="46" width="216" height="158" rx="3"/></clipPath>
  </defs>

  <!-- ambient dot field -->
  <rect x="380" y="300" width="270" height="230" fill="url(#dotGrid)"/>
  <rect x="0" y="40" width="130" height="150" fill="url(#dotGrid)" opacity=".6"/>

  <!-- ============ node graph, upper left ============ -->
  <g stroke="#0C0A09" stroke-width="1.6" fill="none" opacity=".85">
    <path d="M62 86 L132 52 M132 52 L196 92 M62 86 L118 128 M118 128 L196 92 M132 52 L118 128"/>
  </g>
  <g>
    <circle cx="62" cy="86" r="9" fill="#fff" stroke="#0C0A09" stroke-width="2.2"/>
    <circle cx="132" cy="52" r="12" fill="#E5400A" stroke="#0C0A09" stroke-width="2.2"/>
    <circle cx="196" cy="92" r="9" fill="#fff" stroke="#0C0A09" stroke-width="2.2"/>
    <circle cx="118" cy="128" r="7.5" fill="#1E3A8A" stroke="#0C0A09" stroke-width="2.2"/>
  </g>

  <!-- ============ secondary panel: bars ============ -->
  <rect x="404" y="52" width="216" height="158" rx="3" fill="#0C0A09"/>
  <rect x="398" y="46" width="216" height="158" rx="3" fill="#FFFFFF" stroke="#0C0A09" stroke-width="2.4"/>
  <line x1="398" y1="76" x2="614" y2="76" stroke="#0C0A09" stroke-width="2.4"/>
  <circle cx="412" cy="61" r="3.2" fill="#E5400A"/>
  <circle cx="424" cy="61" r="3.2" fill="#0C0A09" opacity=".25"/>
  <circle cx="436" cy="61" r="3.2" fill="#0C0A09" opacity=".25"/>
  <g clip-path="url(#panel2Clip)">
    <g stroke="#0C0A09" stroke-width="1" opacity=".12">
      <line x1="398" y1="118" x2="614" y2="118"/>
      <line x1="398" y1="150" x2="614" y2="150"/>
    </g>
    <rect x="422" y="132" width="22" height="52" fill="#1E3A8A"/>
    <rect x="454" y="110" width="22" height="74" fill="#1E3A8A" opacity=".72"/>
    <rect x="486" y="146" width="22" height="38" fill="#1E3A8A" opacity=".5"/>
    <rect x="518" y="96" width="22" height="88" fill="#E5400A"/>
    <rect x="550" y="124" width="22" height="60" fill="#1E3A8A" opacity=".62"/>
    <line x1="398" y1="184" x2="614" y2="184" stroke="#0C0A09" stroke-width="2"/>
  </g>

  <!-- ============ main panel: line + area ============ -->
  <rect x="52" y="156" width="392" height="232" rx="3" fill="#0C0A09"/>
  <rect x="46" y="150" width="392" height="232" rx="3" fill="#FFFFFF" stroke="#0C0A09" stroke-width="2.6"/>
  <line x1="46" y1="184" x2="438" y2="184" stroke="#0C0A09" stroke-width="2.6"/>
  <circle cx="62" cy="167" r="3.4" fill="#E5400A"/>
  <circle cx="75" cy="167" r="3.4" fill="#0C0A09" opacity=".25"/>
  <circle cx="88" cy="167" r="3.4" fill="#0C0A09" opacity=".25"/>
  <rect x="330" y="160" width="96" height="14" rx="2" fill="#0C0A09" opacity=".08"/>

  <g clip-path="url(#panelClip)">
    <g stroke="#0C0A09" stroke-width="1" opacity=".10">
      <line x1="46" y1="228" x2="438" y2="228"/>
      <line x1="46" y1="272" x2="438" y2="272"/>
      <line x1="46" y1="316" x2="438" y2="316"/>
      <line x1="120" y1="184" x2="120" y2="382"/>
      <line x1="196" y1="184" x2="196" y2="382"/>
      <line x1="272" y1="184" x2="272" y2="382"/>
      <line x1="348" y1="184" x2="348" y2="382"/>
    </g>

    <!-- comparison series (model baseline) -->
    <path d="M70 322 L120 312 L160 320 L196 296 L236 302 L272 274 L310 282 L348 252 L400 240 L430 246 L430 360 L70 360 Z"
          fill="url(#areaFill2)"/>
    <path d="M70 322 L120 312 L160 320 L196 296 L236 302 L272 274 L310 282 L348 252 L400 240 L430 246"
          fill="none" stroke="#1E3A8A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
          stroke-dasharray="6 5" opacity=".75"/>

    <!-- primary series -->
    <path d="M70 306 L108 288 L146 300 L184 254 L222 268 L260 224 L298 238 L336 200 L374 216 L412 178 L430 186 L430 360 L70 360 Z"
          fill="url(#areaFill)"/>
    <path d="M70 306 L108 288 L146 300 L184 254 L222 268 L260 224 L298 238 L336 200 L374 216 L412 178 L430 186"
          fill="none" stroke="#E5400A" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#FFFFFF" stroke="#E5400A" stroke-width="2.6">
      <circle cx="260" cy="224" r="4.6"/>
      <circle cx="336" cy="200" r="4.6"/>
      <circle cx="412" cy="178" r="5.6"/>
    </g>
    <line x1="46" y1="360" x2="438" y2="360" stroke="#0C0A09" stroke-width="2.2"/>
  </g>

  <!-- callout marker on the peak -->
  <g>
    <line x1="412" y1="178" x2="412" y2="132" stroke="#0C0A09" stroke-width="1.6" stroke-dasharray="3 3"/>
    <rect x="374" y="108" width="78" height="26" rx="2" fill="#0C0A09"/>
    <text x="413" y="125" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"
          font-size="12" fill="#FFFFFF" letter-spacing="0.5">+54.3%</text>
  </g>

  <!-- ============ donut breakdown ============ -->
  <g transform="translate(112,462)">
    <circle cx="0" cy="0" r="52" fill="#0C0A09" transform="translate(5,5)"/>
    <circle cx="0" cy="0" r="52" fill="#FFFFFF" stroke="#0C0A09" stroke-width="2.6"/>
    <!-- segments: 46% vermilion, 32% navy, 22% ochre -->
    <path d="M0 0 L0 -52 A52 52 0 0 1 43.9 27.9 Z" fill="#E5400A"/>
    <path d="M0 0 L43.9 27.9 A52 52 0 0 1 -34.8 38.7 Z" fill="#1E3A8A" opacity=".85"/>
    <path d="M0 0 L-34.8 38.7 A52 52 0 0 1 0 -52 Z" fill="#B45309" opacity=".75"/>
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#0C0A09" stroke-width="2.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"
          font-size="13" fill="#0C0A09">K=3</text>
  </g>

  <!-- ============ clustered scatter ============ -->
  <g transform="translate(468,300)">
    <line x1="-8" y1="200" x2="176" y2="200" stroke="#0C0A09" stroke-width="2.2"/>
    <line x1="-8" y1="34" x2="-8" y2="200" stroke="#0C0A09" stroke-width="2.2"/>
    <g fill="#E5400A" opacity=".85">
      <circle cx="34" cy="78" r="5"/><circle cx="52" cy="62" r="6.5"/><circle cx="24" cy="58" r="4.5"/>
      <circle cx="46" cy="90" r="4"/><circle cx="64" cy="80" r="5.5"/><circle cx="38" cy="68" r="3.5"/>
      <circle cx="60" cy="48" r="4"/>
    </g>
    <g fill="#1E3A8A" opacity=".8">
      <circle cx="118" cy="120" r="6"/><circle cx="136" cy="104" r="5"/><circle cx="106" cy="106" r="4.5"/>
      <circle cx="128" cy="134" r="4"/><circle cx="146" cy="122" r="5.5"/><circle cx="112" cy="90" r="3.6"/>
    </g>
    <g fill="#B45309" opacity=".8">
      <circle cx="56" cy="164" r="5.5"/><circle cx="74" cy="150" r="4.6"/><circle cx="42" cy="152" r="4"/>
      <circle cx="68" cy="176" r="5"/><circle cx="86" cy="162" r="3.8"/>
    </g>
    <!-- centroid rings -->
    <g fill="none" stroke-width="2.2">
      <circle cx="45" cy="70" r="12" stroke="#E5400A" stroke-dasharray="4 3"/>
      <circle cx="124" cy="113" r="12" stroke="#1E3A8A" stroke-dasharray="4 3"/>
      <circle cx="64" cy="160" r="11" stroke="#B45309" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- floating geometric accents -->
  <rect x="592" y="252" width="18" height="18" fill="none" stroke="#E5400A" stroke-width="2.4" transform="rotate(18 601 261)"/>
  <rect x="18" y="330" width="14" height="14" fill="#1E3A8A" opacity=".5" transform="rotate(-14 25 337)"/>
  <circle cx="626" cy="462" r="7" fill="#B45309" opacity=".6"/>
  <circle cx="22" cy="224" r="5" fill="#E5400A" opacity=".55"/>
</svg>
